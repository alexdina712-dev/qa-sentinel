name: QA Sentinel verification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend scripts && python -m ruff format --check backend scripts
      - run: python -m pytest --junitxml=reports/pytest.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=reports/vitest.json
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: python scripts/mutation_demo.py
      - name: Consolidate test results
        if: always()
        run: python scripts/report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-sentinel-verification
          retention-days: 14
          path: |
            reports/
            playwright-report/
            test-results/
